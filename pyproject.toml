[project]
name = "ghrec"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "polars", "pyarrow", "duckdb", "lightgbm", "scikit-learn"]

[project.optional-dependencies]
service = ["fastapi", "uvicorn", "redis", "orjson"]
dev = ["pytest", "httpx", "fastapi", "redis"]

[tool.setuptools.packages.find]
include = ["ghrec*"]

[tool.pytest.ini_options]
pythonpath = ["."]
